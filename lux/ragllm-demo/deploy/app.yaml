apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rag-app
  template:
    metadata:
      labels:
        app: rag-app
    spec:
      containers:
        - name: app
          image: YOUR_REGISTRY/gemma-rag-demo:latest
          envFrom:
            - secretRef:
                name: rag-database
            - secretRef:
                name: huggingface
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: VLLM_BASE_URL
              value: http://vllm:8000/v1
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: rag-app
spec:
  selector:
    app: rag-app
  ports:
    - port: 80
      targetPort: 8000
