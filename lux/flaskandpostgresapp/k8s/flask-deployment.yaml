apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: subilabrahamornl/flask-postgres-demo:latest
          ports:
            - containerPort: 5000
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          envFrom:
            - configMapRef:
                name: flask-config
          readinessProbe:
            httpGet:
              path: /api/messages
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
