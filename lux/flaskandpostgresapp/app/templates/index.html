<!doctype html>
<html>
<head>
    <title>Flask + PostgreSQL Messages</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 2rem; }
        h1 { color: #333; }
        form { margin-bottom: 2rem; }
        input[type=text] { padding: 0.5rem; width: 300px; }
        button { padding: 0.5rem 1rem; }
        ul { padding-left: 1.2rem; }
        li { margin-bottom: 0.5rem; }
        .meta { color: #666; font-size: 0.9rem; }
    </style>
</head>
<body>
    <h1>Messages</h1>

    <form id="messageForm">
        <input type="text" id="messageInput" placeholder="Enter a message" required />
        <button type="submit">Add Message</button>
    </form>

    <ul id="messages"></ul>

    <script>
        async function loadMessages() {
            const res = await fetch('/api/messages');
            const data = await res.json();
            const list = document.getElementById('messages');
            list.innerHTML = '';
            data.forEach(msg => {
                const li = document.createElement('li');
                li.innerHTML = `<strong>${msg.content}</strong><br><span class="meta">ID: ${msg.id} | Created: ${msg.created_at}</span>`;
                list.appendChild(li);
            });
        }

        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('messageInput');
            const content = input.value.trim();
            if (!content) return;

            await fetch('/api/messages', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ content })
            });

            input.value = '';
            loadMessages();
        });

        loadMessages();
    </script>
</body>
</html>
