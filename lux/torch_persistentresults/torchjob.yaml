apiVersion: batch/v1
kind: Job
metadata:
  name: torch-jobs
  namespace: stf007-demo-app
  labels:
    app: torch-jobs
spec:
  completions: 7
  parallelism: 3
  template:
    spec:
      containers:
        - image: "harbor.ccs.ornl.gov/subil/torchjob:latest"
          name: gpu-pod
          workingDir: "/root"
          command: ["python3", "torch_mnist.py", "--accel"]
          #command: ["/bin/bash"]
          #args: ["-c", "sleep 10000"]
          envFrom:
            - secretRef:
                name: postgres-secrets
            - configMapRef:
                name: postgres-config
          resources:
            limits:
              amd.com/gpu: 1
            requests:
              amd.com/gpu: 1
          imagePullPolicy: Always
      restartPolicy: Never
      imagePullSecrets: 
        - name: harbor-pull-secret
