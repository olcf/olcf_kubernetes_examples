apiVersion: batch/v1
kind: Job
metadata:
  name: torch-jobs
  namespace: stf007-demo-app
  labels:
    app: torch-jobs
spec:
  completions: 1
  parallelism: 1
  template:
    spec:
      containers:
        - image: "harbor.ccs.ornl.gov/subil/torchjob:latest"
          name: gpu-pod
          command: ["/bin/bash"]
          args: ["-c", "sleep 10000"]
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: POSTGRES_HOST
              value: postgres
          resources:
            limits:
              amd.com/gpu: 1
            requests:
              amd.com/gpu: 1
          imagePullPolicy: Always
      restartPolicy: Never
      imagePullSecrets: 
        - name: harbor-pull-secret
 
