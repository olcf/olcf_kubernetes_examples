apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: stf007-demo-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flask-app
  template:
    metadata:
      labels:
        app: flask-app
    spec:
      containers:
        - name: flask-app
          image: harbor.ccs.ornl.gov/subil/flask-torchresults:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: postgres-secrets
          env:
            - name: POSTGRES_HOST
              value: postgres
---
apiVersion: v1
kind: Service
metadata:
  name: flask-app
  namespace: stf007-demo-app
spec:
  type: NodePort
  selector:
    app: flask-app
  ports:
    - port: 8000
      targetPort: 8000
