apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: stf007-gpu
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:18
          envFrom:
            - secretRef:
                name: postgres-secrets
          ports:
            - containerPort: 5432
#          command: ["/bin/bash"] # for starting a container so I can open a shell instead of running postgres and erroring out
#          args: [ "-c", "sleep 9000" ]
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
              subPath: data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
