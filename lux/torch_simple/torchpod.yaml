apiVersion: v1
kind: Pod
metadata:
  name: torch-pod
spec:
  containers:
  - image: "docker.io/subilabrahamornl/sampletorch:latest"
    name: gpu-pod
    command: ["/bin/bash"]
    args: ["-c", "sleep", "infinity"]
    resources:
      limits:
        amd.com/gpu: 1
      requests:
        amd.com/gpu: 1
  restartPolicy: Never
