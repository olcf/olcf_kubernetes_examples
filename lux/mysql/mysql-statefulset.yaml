apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql-poc
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      securityContext:
        fsGroup: 0
      containers:
        - name: mysql
          image: quay.io/sclorg/mysql-80-c9s
          ports:
          - containerPort: 3306
            name: mysql
          envFrom:
          - secretRef:
              name: mysql-secret # Loads all specified secrets as environmental variables.
          - configMapRef:
              name: mysql-config
          volumeMounts:
          - name: mysql-data
            mountPath: /var/lib/mysql/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysql -h 127.0.0.1 -u root -p\"$MYSQL_ROOT_PASSWORD\" -e \"SELECT 1\""]
            initialDelaySeconds: 15
            periodSeconds: 5
            timeoutSeconds: 5
      volumes: []
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: standard
      resources:
        requests:
          storage: 2Gi